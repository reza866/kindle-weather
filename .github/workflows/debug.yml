name: Debug connection (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test
        run: |
          URL="https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m"
          echo "== DNS"; getent ahosts api.open-meteo.com | head -4 || true
          echo "== curl (system OpenSSL)"; curl -sS -m 30 -o /dev/null -w "http=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" "$URL" || true
          T='import ssl,sys,time,urllib.request as u
          print(sys.version.split()[0], ssl.OPENSSL_VERSION)
          t=time.time()
          try: print("ok", u.urlopen(sys.argv[1], timeout=30).status, round(time.time()-t,2), "s")
          except Exception as e: print("FAIL", repr(e), round(time.time()-t,2), "s")'
          echo "== system python"; /usr/bin/python3 -c "$T" "$URL"
          echo "== setup-python 3.13"; python -c "$T" "$URL"
          echo "== openssl s_client default groups"; timeout 20 openssl s_client -connect api.open-meteo.com:443 -servername api.open-meteo.com -brief </dev/null 2>&1 | head -5 || true
