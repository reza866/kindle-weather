name: Update weather

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may run this a few minutes late
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write          # only for the keep-alive step below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install font
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            || (sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core)

      - name: Install Pillow (pinned by hash)
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements.txt"

      - name: Render
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
        run: python render.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling the workflow resets that.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
