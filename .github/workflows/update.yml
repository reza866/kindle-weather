name: Update weather

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may run this a few minutes late
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read          # this job runs outside code and holds the location: read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install font
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            || (sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core)

      - name: Install Pillow (pinned by hash)
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements.txt"

      - name: Render
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
        run: python render.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # GitHub pauses scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling the workflow resets that. This job is kept
  # separate so the token that can manage workflows never sits next to the
  # location secrets or any outside code.
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
